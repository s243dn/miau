<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - MediaPriceTracker'">MediaPriceTracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); font-family: 'Segoe UI', sans-serif; }
        
        /* Sidebar */
        .sidebar { position: fixed; left: 0; top: 0; width: 280px; height: 100vh; background: rgba(26, 26, 46, 0.95); backdrop-filter: blur(10px); border-right: 1px solid rgba(255,255,255,0.1); z-index: 1000; transition: all 0.3s; }
        .sidebar-header { padding: 25px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-header h3 { color: white; margin: 0; }
        .sidebar-header p { color: #a0a0b0; font-size: 0.8rem; margin: 5px 0 0 0; }
        .sidebar-nav { padding: 20px 0; }
        .sidebar-nav a { display: flex; align-items: center; gap: 12px; padding: 12px 25px; color: #a0a0b0; text-decoration: none; transition: all 0.3s; margin: 4px 0; }
        .sidebar-nav a:hover, .sidebar-nav a.active { background: rgba(102, 126, 234, 0.2); color: white; border-left: 3px solid #667eea; }
        .sidebar-nav i { width: 24px; font-size: 1.2rem; }
        .sidebar-footer { position: absolute; bottom: 0; width: 100%; padding: 20px 25px; border-top: 1px solid rgba(255,255,255,0.1); }
        .sidebar-footer a { color: #a0a0b0; text-decoration: none; display: flex; align-items: center; gap: 12px; }
        .sidebar-footer a:hover { color: white; }
        
        /* Main Content */
        .main-content { margin-left: 280px; min-height: 100vh; padding: 25px 35px; }
        
        /* Top Bar */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .page-title { color: white; font-size: 1.8rem; font-weight: bold; }
        .user-info { background: rgba(255,255,255,0.1); border-radius: 30px; padding: 8px 20px; color: white; display: flex; align-items: center; gap: 10px; }
        .user-info img { width: 35px; height: 35px; border-radius: 50%; background: #667eea; display: flex; align-items: center; justify-content: center; }
        
        /* Cards */
        .card-glass { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 20px; padding: 20px; border: 1px solid rgba(255,255,255,0.2); }
        
        @media (max-width: 768px) {
            .sidebar { width: 70px; }
            .sidebar-header h3, .sidebar-header p, .sidebar-nav span, .sidebar-footer span { display: none; }
            .sidebar-nav a { justify-content: center; padding: 12px; }
            .sidebar-nav i { margin: 0; }
            .main-content { margin-left: 70px; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h3><i class="fas fa-gamepad"></i> MediaPrice</h3>
            <p>Tracker</p>
        </div>
        <div class="sidebar-nav">
            <a href="/dashboard" th:classappend="${currentPage == 'dashboard' ? 'active' : ''}">
                <i class="fas fa-tachometer-alt"></i> <span>Dashboard</span>
            </a>
            <a href="/games" th:classappend="${currentPage == 'games' ? 'active' : ''}">
                <i class="fas fa-search"></i> <span>Explorar Digital</span>
            </a>
            <a href="/physical" th:classappend="${currentPage == 'physical' ? 'active' : ''}">
                <i class="fas fa-box"></i> <span>Explorar Físico</span>
            </a>
            <a href="/offers" th:classappend="${currentPage == 'offers' ? 'active' : ''}">
                <i class="fas fa-gift"></i> <span>Juegos Gratis</span>
            </a>
            <a href="/wishlist" th:classappend="${currentPage == 'wishlist' ? 'active' : ''}">
                <i class="fas fa-heart"></i> <span>Mi Wishlist</span>
            </a>
        </div>
        <div class="sidebar-footer">
            <a href="/profile">
                <i class="fas fa-user-circle"></i> <span>Mi Perfil</span>
            </a>
            <a href="/logout" class="mt-2">
                <i class="fas fa-sign-out-alt"></i> <span>Cerrar Sesión</span>
            </a>
        </div>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <h1 class="page-title" th:text="${pageTitle}">Bienvenido</h1>
            <div class="user-info" th:if="${username != null}">
                <i class="fas fa-user-circle fa-2x"></i>
                <span th:text="${username}"></span>
            </div>
        </div>
        
        <div th:replace="${content}"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
