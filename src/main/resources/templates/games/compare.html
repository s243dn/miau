<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparativa - MediaPriceTracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">MediaPriceTracker</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="alert alert-info">
            <strong>Comparando:</strong> <span th:text="${comparison.gameTitle}">Cargando...</span>
        </div>

        <div class="row">
            <div class="col-md-6 mx-auto">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4>Steam</h4>
                    </div>
                    <div class="card-body text-center">
                        <h2 th:text="${comparison.steamPrice != null ? comparison.steamPrice + ' €' : 'No disponible'}"></h2>
                        <a th:href="${comparison.steamUrl}" target="_blank" class="btn btn-primary">Ver en Steam</a>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="text-center mt-4">
            <a href="/dashboard" class="btn btn-secondary">Volver</a>
        </div>
    </div>
</body>
</html>
