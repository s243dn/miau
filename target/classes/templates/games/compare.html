<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparativa - MediaPriceTracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS para que el spinner se vea realmente profesional y centrado */
        #loading-screen {
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">MediaPriceTracker</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="alert alert-info">
            <strong>Comparando:</strong>
            <span th:text="${comparison.gameTitle}">Cargando...</span>
        </div>

        <div id="loading-screen">
            <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
            <h3 class="mt-3">Buscando ofertas en el multiverso...</h3>
            <p class="text-muted">Esto puede tardar unos segundos. ¡Vale la pena!</p>
        </div>

        <div id="results-container"></div>

        <div class="row mt-4">
            <div class="col-md-6 mx-auto">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white text-center">
                        <h4><i class="fa-brands fa-steam"></i> Steam (Info Fija)</h4>
                    </div>
                    <div class="card-body text-center">
                        <h2 th:text="${comparison.steam != null ? comparison.steam.currentPrice + ' €' : 'No disponible'}"></h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="text-center mt-4">
            <a href="/dashboard" class="btn btn-secondary">Volver</a>
        </div>
    </div>

    <script th:inline="javascript">
        window.onload = function () {
            // CORRECCIÓN: Quitamos los espacios dentro de los corchetes
            const gameName = /*[[${comparison.gameTitle}]]*/ 'Juego'; 
            const container = document.getElementById('results-container');
            const loader = document.getElementById('loading-screen');

            fetch('/api/compare-fragment?gameName=' + encodeURIComponent(gameName))
                .then(response => {
                    if (!response.ok) throw new Error("Error en servidor");
                    return response.text();
                })
                .then(html => {
                    container.innerHTML = html;
                    loader.style.display = 'none'; // Ocultamos el spinner
                })
                .catch(error => {
                    loader.innerHTML = "<div class='alert alert-danger'>Error al conectar con las tiendas.</div>";
                    console.error("Error al cargar fragmento:", error);
                });
        };
    </script>
</body>
</html>
