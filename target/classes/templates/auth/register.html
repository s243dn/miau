<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - MediaPriceTracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .register-card { background: white; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); padding: 40px; width: 100%; max-width: 450px; }
        .register-card h2 { color: #333; font-weight: 700; margin-bottom: 10px; }
        .form-control { border-radius: 30px; padding: 12px 20px; border: 1px solid #e0e0e0; }
        .form-control:focus { box-shadow: none; border-color: #667eea; }
        .btn-register { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; border-radius: 30px; padding: 12px; font-weight: bold; width: 100%; color: white; }
        .btn-register:hover { transform: scale(1.02); }
        .input-group-text { background: white; border-right: none; border-radius: 30px 0 0 30px; }
        .input-group .form-control { border-left: none; border-radius: 0 30px 30px 0; }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="register-card">
            <div class="text-center mb-4">
                <i class="fas fa-gamepad fa-3x text-primary mb-3"></i>
                <h2>MediaPriceTracker</h2>
                <p class="text-muted">Crea tu cuenta gratis</p>
            </div>

            <div th:if="${error}" class="alert alert-danger text-center" th:text="${error}"></div>

            <form action="/register" method="post">
                <div class="mb-3">
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user text-muted"></i></span>
                        <input type="text" name="username" class="form-control" placeholder="Usuario" required autofocus>
                    </div>
                </div>
                <div class="mb-3">
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-envelope text-muted"></i></span>
                        <input type="email" name="email" class="form-control" placeholder="Correo electrónico" required>
                    </div>
                </div>
                <div class="mb-3">
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="Contraseña" required>
                    </div>
                </div>
                <button type="submit" class="btn-register mb-3">Registrarse</button>
            </form>

            <hr>
            <div class="text-center">
                <a href="/login" class="text-decoration-none">¿Ya tienes cuenta? Inicia sesión</a>
            </div>
        </div>
    </div>
</body>
</html>
