<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Juegos Gratis - MediaPriceTracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); font-family: 'Segoe UI', sans-serif; }
        .sidebar { position: fixed; left: 0; top: 0; width: 260px; height: 100vh; background: rgba(26,26,46,0.95); backdrop-filter: blur(10px); border-right: 1px solid rgba(255,255,255,0.1); }
        .sidebar-header { padding: 25px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-header h3 { color: white; margin: 0; }
        .sidebar-nav { padding: 20px 0; }
        .sidebar-nav a { display: flex; align-items: center; gap: 12px; padding: 12px 25px; color: #a0a0b0; text-decoration: none; transition: all 0.3s; }
        .sidebar-nav a:hover, .sidebar-nav a.active { background: rgba(102,126,234,0.2); color: white; border-left: 3px solid #667eea; }
        .sidebar-nav i { width: 24px; }
        .sidebar-footer { position: absolute; bottom: 0; width: 100%; padding: 20px 25px; border-top: 1px solid rgba(255,255,255,0.1); }
        .sidebar-footer a { color: #a0a0b0; text-decoration: none; display: flex; align-items: center; gap: 12px; }
        .sidebar-footer a:hover { color: white; }
        .main-content { margin-left: 260px; padding: 25px; }
        .card-glass { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 20px; overflow: hidden; transition: transform 0.3s; height: 100%; }
        .card-glass:hover { transform: translateY(-5px); }
        .offer-img { height: 180px; object-fit: cover; width: 100%; }
        .offer-body { padding: 20px; }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); border: none; border-radius: 25px; padding: 8px 20px; color: white; text-decoration: none; display: inline-block; }
        .text-white { color: white; }
        .text-white-50 { color: rgba(255,255,255,0.7); }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header"><h3><i class="fas fa-gamepad"></i> MediaPrice</h3><p>Tracker</p></div>
        <div class="sidebar-nav">
            <a href="/dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a href="/games"><i class="fas fa-search"></i> Explorar Digital</a>
            <a href="/physical"><i class="fas fa-box"></i> Explorar Físico</a>
            <a href="/offers" class="active"><i class="fas fa-gift"></i> Juegos Gratis</a>
            <a href="/wishlist"><i class="fas fa-heart"></i> Mi Wishlist</a>
        </div>
        <div class="sidebar-footer">
            <a href="/profile"><i class="fas fa-user-circle"></i> Mi Perfil</a>
            <a href="/logout"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
        </div>
    </div>

    <div class="main-content">
        <h1 class="text-white mb-4"><i class="fab fa-epic-games"></i> Juegos Gratis de Epic Games</h1>
        <div id="gamesContainer" class="row g-4"></div>
    </div>

    <script>
        fetch('/api/free-games')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('gamesContainer');
                if (!data || data.length === 0) {
                    container.innerHTML = '<div class="col-12 text-center text-white"><p>No hay juegos disponibles</p></div>';
                    return;
                }
                let html = '';
                data.forEach(game => {
                    let imgUrl = game.imageUrl || 'https://via.placeholder.com/300x180?text=Epic+Games';
                    let gameUrl = game.url && game.url !== 'null' ? game.url : 'https://store.epicgames.com';
                    html += `<div class="col-md-4"><div class="card-glass">
                        <img src="${imgUrl}" class="offer-img" onerror="this.src='https://via.placeholder.com/300x180'">
                        <div class="offer-body">
                            <h5 class="text-white">${game.title}</h5>
                            <p class="text-white-50 small">${game.description ? game.description.substring(0, 100) : 'Reclama tu juego gratuito'}</p>
                            <a href="${gameUrl}" target="_blank" class="btn-primary">Reclamar gratis</a>
                        </div>
                    </div></div>`;
                });
                container.innerHTML = html;
            })
            .catch(() => {
                document.getElementById('gamesContainer').innerHTML = '<div class="col-12 text-center text-white"><p>Error al cargar juegos</p></div>';
            });
    </script>
</body>
</html>
